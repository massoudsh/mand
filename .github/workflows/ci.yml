name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run db:migrate && npm run db:seed
      - run: npm run test:coverage
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mand:ci
      - name: Smoke test container
        run: |
          docker run -d --name mand-ci -p 3000:3000 \
            -e MAND_APPROVER_KEY="$(openssl rand -hex 24)" mand:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/ready; then exit 0; fi
            sleep 1
          done
          docker logs mand-ci
          exit 1
